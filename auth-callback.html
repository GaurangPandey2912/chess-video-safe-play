<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Video — Login Successful</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #30305a;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      max-width: 380px;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h2 { margin-bottom: 8px; font-size: 20px; }
    p { color: #888; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h2>Logged in successfully!</h2>
    <p>Your Chess Video extension is now connected.<br>You can close this tab and open chess.com to see your friends.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (token) {
      try {
        chrome.storage.local.set({ cv_token: token }, () => {
          fetch('http://localhost:3000/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
          })
          .then(r => r.json())
          .then(data => {
            if (data.user) {
              chrome.storage.local.set({ cv_user: data.user });
            }
          })
          .catch(() => {});
        });
      } catch (e) {
        document.querySelector('p').textContent = 'Failed to save token. Try logging in from the extension popup.';
      }
    } else {
      document.querySelector('h2').textContent = 'Login failed';
      document.querySelector('p').textContent = 'No token received. Please try logging in again.';
    }
  </script>
</body>
</html>
