<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      font-size: 13px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 11px; margin-bottom: 14px; }

    .btn {
      display: inline-block; padding: 7px 14px;
      background: #4a6cf7; color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-size: 12px;
      text-decoration: none; text-align: center;
    }
    .btn:hover { background: #5b7cff; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .btn-secondary { background: #30305a; }
    .btn-secondary:hover { background: #40407a; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #e74c5c; }
    .btn-block { display: block; width: 100%; }
    .btn-tab {
      flex: 1; padding: 6px; background: transparent; color: #6b7280;
      border: none; cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent;
    }
    .btn-tab.active { color: #e0e0e0; border-bottom-color: #4a6cf7; }

    .input {
      width: 100%; padding: 7px 10px; background: #0f0f1a;
      border: 1px solid #30305a; border-radius: 6px; color: #e0e0e0;
      font-size: 12px; outline: none;
    }
    .input:focus { border-color: #4a6cf7; }

    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 11px; color: #888; margin-bottom: 3px; }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.online { background: #4ade80; }
    .status-dot.offline { background: #6b7280; }

    .friend-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid #30305a; font-size: 12px;
    }
    .friend-item:last-child { border-bottom: none; }
    .friend-item .left { display: flex; align-items: center; gap: 6px; }

    .section { margin-bottom: 8px; }
    .section-title {
      font-size: 11px; text-transform: uppercase; color: #6b7280;
      margin-bottom: 4px; letter-spacing: 0.5px;
    }

    .error { color: #ff6b6b; font-size: 11px; margin-bottom: 6px; display: none; }
    .tab-bar { display: flex; margin-bottom: 12px; gap: 0; }
    .user-row { background: #0f0f1a; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .mt-1 { margin-top: 8px; }

    #logged-in, #auth-panel { display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="flex-between" style="margin-bottom:6px">
    <h1>♟ Chess Video</h1>
  </div>
  <p class="subtitle">Safe video chat for chess.com</p>

  <!-- Auth Panel -->
  <div id="auth-panel">
    <div class="tab-bar">
      <button class="btn-tab active" id="tab-login">Login</button>
      <button class="btn-tab" id="tab-signup">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" class="input" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" class="input" autocomplete="current-password">
      </div>
      <div class="error" id="login-error"></div>
      <button class="btn btn-block" id="login-submit">Login</button>
    </div>

    <!-- Signup Form -->
    <div id="form-signup" class="hidden">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signup-username" class="input" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" class="input" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password (6+ characters)</label>
        <input type="password" id="signup-password" class="input" autocomplete="new-password">
      </div>
      <div class="error" id="signup-error"></div>
      <button class="btn btn-block" id="signup-submit">Sign Up</button>
    </div>
  </div>

  <!-- Logged In Panel -->
  <div id="logged-in">
    <div class="user-row">
      <div class="flex-between">
        <span id="username-display"></span>
        <button class="btn btn-sm btn-danger" id="logout-btn">Logout</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Online Friends</div>
      <div id="online-list"><p style="color:#6b7280;font-size:11px">No friends online</p></div>
    </div>

    <div class="section">
      <div class="section-title">Offline Friends</div>
      <div id="offline-list"><p style="color:#6b7280;font-size:11px">No offline friends</p></div>
    </div>

    <a href="http://localhost:3000/" target="_blank" class="btn btn-sm btn-secondary btn-block" style="margin-top:4px">Open Dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
