<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Chess Video</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <h1 class="nav-title">♟ Chess Video</h1>
      <div class="nav-right">
        <a href="/signup" class="nav-link">Sign Up</a>
        <a href="/index.html" class="nav-link">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="form-box">
      <h2>Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input" required autocomplete="current-password">
        </div>
        <div id="form-error" class="error-msg" style="display:none"></div>
        <button type="submit" class="btn btn-full">Login</button>
      </form>
      <p class="text-muted mt-1">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    const extensionId = params.get('extensionId');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('form-error');
      errorEl.style.display = 'none';

      try {
        const url = redirect === 'extension'
          ? `/api/auth/login?redirect=extension&extensionId=${extensionId}`
          : '/api/auth/login';

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.style.display = 'block';
          return;
        }

        if (data.redirect) {
          window.location.href = data.redirect;
        } else {
          localStorage.setItem('cv_token', data.token);
          localStorage.setItem('cv_user', JSON.stringify(data.user));
          window.location.href = '/';
        }
      } catch (err) {
        errorEl.textContent = 'Network error — is the server running?';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
